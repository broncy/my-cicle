<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🩸</text></svg>">
    <title>Il Mio Ciclo - Ciclo Fisso 28 Giorni</title>
    <style>
        body { font-family: sans-serif; background: #fff5f5; color: #333; text-align: center; padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 400px; margin: 0 auto 20px; text-align: left; }
        h1, h2 { color: #d63031; text-align: center; margin-top: 0; }
        p { margin: 5px 0; }
        button { background: #d63031; color: white; border: none; padding: 12px 20px; border-radius: 25px; font-size: 16px; cursor: pointer; width: 100%; margin-top: 10px; }
        input { width: 94%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; }
        .result { font-size: 18px; font-weight: bold; margin-top: 15px; color: #555; text-align: center; }
        .highlight { color: #e84393; font-size: 22px; }
        
        /* Stili per la lista dello storico */
        .history-list { list-style: none; padding: 0; margin: 15px 0 0 0; }
        .history-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #eee; font-size: 15px; }
        .history-item:last-child { border-bottom: none; }
        .days-interval { display: block; font-size: 12px; color: #7f8c8d; margin-top: 2px; }
        .btn-delete { background: #b2bec3; color: white; border: none; padding: 5px 10px; border-radius: 5px; font-size: 12px; cursor: pointer; width: auto; margin: 0; }
        .btn-delete:hover { background: #d63031; }
    </style>
</head>
<body>

    <div class="card">
        <h1>🩸 Il Mio Ciclo</h1>
        <p><b>Segnala inizio ciclo:</b></p>
        <input type="date" id="newPeriodDate">
        <button onclick="addPeriod()">Registra Data</button>
    </div>

    <div class="card">
        <h2>Prossima Previsione</h2>
        <div id="prediction" class="result">Inserisci almeno una data per vedere la previsione.</div>
    </div>

    <div class="card">
        <h2>Visualizza Storico</h2>
        <ul id="historyList" class="history-list"></ul>
    </div>

    <script>
        let periodHistory = [];

        window.onload = function() {
            const savedHistory = localStorage.getItem('periodHistory');
            if (savedHistory) {
                periodHistory = JSON.parse(savedHistory);
                periodHistory.sort((a, b) => new Date(b) - new Date(a));
            }
            
            document.getElementById('newPeriodDate').value = new Date().toISOString().split('T')[0];
            
            renderAll();
        };

        function addPeriod() {
            const dateInput = document.getElementById('newPeriodDate').value;

            if (!dateInput) {
                alert("Per favore, seleziona una data valida.");
                return;
            }

            if (periodHistory.includes(dateInput)) {
                alert("Questa data è già presente nello storico!");
                return;
            }

            periodHistory.unshift(dateInput);
            periodHistory.sort((a, b) => new Date(b) - new Date(a));
            localStorage.setItem('periodHistory', JSON.stringify(periodHistory));

            renderAll();
        }

        function deletePeriod(index) {
            if (confirm("Vuoi davvero eliminare questa data dallo storico?")) {
                periodHistory.splice(index, 1);
                localStorage.setItem('periodHistory', JSON.stringify(periodHistory));
                renderAll();
            }
        }

        function renderAll() {
            renderHistory();
            calculateNextPeriod();
        }

        function renderHistory() {
            const listElement = document.getElementById('historyList');
            listElement.innerHTML = "";

            if (periodHistory.length === 0) {
                listElement.innerHTML = "<li style='text-align:center; color:#aaa;'>Nessun dato registrato.</li>";
                return;
            }

            const options = { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' };

            periodHistory.forEach((dateString, index) => {
                const dateObj = new Date(dateString);
                const formattedDate = dateObj.toLocaleDateString('it-IT', options);
                
                let intervalText = "(Primo inserimento)";
                if (index < periodHistory.length - 1) {
                    const prevDateObj = new Date(periodHistory[index + 1]);
                    const diffTime = dateObj - prevDateObj;
                    const diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24));
                    intervalText = `(Distanza: ${diffDays} gg)`;
                }
                
                const li = document.createElement('li');
                li.className = 'history-item';
                li.innerHTML = `
                    <div>
                        <span>📅 ${formattedDate}</span>
                        <span class="days-interval">${intervalText}</span>
                    </div>
                    <button class="btn-delete" onclick="deletePeriod(${index})">Elimina</button>
                `;
                listElement.appendChild(li);
            });
        }

        // Calcola la previsione usando SEMPRE 28 giorni fisso
        function calculateNextPeriod() {
            const predictionElement = document.getElementById('prediction');

            if (periodHistory.length === 0) {
                predictionElement.innerHTML = "Inserisci almeno una data per vedere la previsione.";
                return;
            }

            const lastPeriodDate = new Date(periodHistory[0]);
            
            // Impostazione rigida a 28 giorni
            const fixedDuration = 28;

            const nextPeriodDate = new Date(lastPeriodDate);
            nextPeriodDate.setDate(nextPeriodDate.getDate() + fixedDuration);

            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const nextDateFormatted = nextPeriodDate.toLocaleDateString('it-IT', options);

            const today = new Date();
            today.setHours(0,0,0,0);
            nextPeriodDate.setHours(0,0,0,0);
            const diffTime = nextPeriodDate - today;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

            let countdownText = "";
            if (diffDays > 0) {
                countdownText = `<br>Mancano <b>${diffDays}</b> giorni.`;
            } else if (diffDays === 0) {
                countdownText = `<br><b>Inizia oggi!</b>`;
            } else {
                countdownText = `<br>Ritardo di <b>${Math.abs(diffDays)}</b> giorni.`;
            }

            predictionElement.innerHTML = `
                L'ultimo ciclo è iniziato il: <b>${lastPeriodDate.toLocaleDateString('it-IT')}</b><br>
                <small style="color:#7f8c8d;">(Calcolo basato su ciclo fisso di 28 giorni)</small><br><br>
                Il prossimo è previsto il:<br>
                <span class="highlight">${nextDateFormatted}</span>${countdownText}
            `;
        }
    </script>
</body>
</html>
